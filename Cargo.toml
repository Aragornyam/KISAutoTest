[package]
name = "rust-repo-autotester"
version = "0.2.0"
edition = "2021"
authors = ["Aragornyam"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[profile.release]
opt-level = "s"
lto = true